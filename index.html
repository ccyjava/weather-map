function tipHtml(name) {
  const t = TIPS[name]; if (!t) return "";
  const parts = [];
  if (t.hike) parts.push("🥾 " + t.hike);
  if (t.spot) parts.push("📍 " + t.spot);
  if (t.climb) parts.push("🧗 " + t.climb);
  if (t.paddle) parts.push("🛶 " + t.paddle);
  return parts.join("<br>");
}

async function toggleRadar() {
  radarOn = !radarOn;
  document.getElementById("radarBtn").classList.toggle("on", radarOn);
  if (radarOn && !radarLayer) {
    try {
      const j = await (await fetch("https://api.rainviewer.com/public/weather-maps.json")).json();
      const past = j.radar && j.radar.past;
      if (past && past.length) {
        const p = past[past.length-1].path;
        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${p}/256/{z}/{x}/{y}/2/1_1.png`, {opacity:.65});
      }
    } catch(err) { console.warn("radar failed", err); }
  }
  if (radarLayer) { radarOn ? radarLayer.addTo(map) : map.removeLayer(radarLayer); }
  else if (radarOn) { radarOn = false; document.getElementById("radarBtn").classList.remove("on"); }
}

function laDate(offsetDays) {
  const now = new Date(new Date().toLocaleString("en-US",{timeZone:"America/Los_Angeles"}));
  now.setDate(now.getDate() + offsetDays);
  return now;
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const wk = d => "周" + ["日","一","二","三","四","五","六"][d.getDay()];

let slots = [], activeSlot = 0, cityData = [];
function buildSlots() {
  const t1 = laDate(1), t2 = laDate(2);
  const f = d => `${d.getMonth()+1}/${d.getDate()}`;
  slots = [
    {label:"明天上午", sub:`${f(t1)} ${wk(t1)}`, time: ymd(t1)+"T09:00"},
    {label:"明天下午", sub:`${f(t1)} ${wk(t1)}`, time: ymd(t1)+"T15:00"},
    {label:"后天上午", sub:`${f(t2)} ${wk(t2)}`, time: ymd(t2)+"T09:00"},
    {label:"后天下午", sub:`${f(t2)} ${wk(t2)}`, time: ymd(t2)+"T15:00"},
  ];
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  slots.forEach((s,i) => {
    const b = document.createElement("button");
    b.innerHTML = `${s.label}<span class="d">${s.sub}</span>`;
    if (i === activeSlot) b.classList.add("active");
    b.onclick = () => { activeSlot = i; buildSlots(); render(); };
    tabs.appendChild(b);
  });
}
function idxOf(times, t) {
  let i = times.indexOf(t);
  if (i >= 0) return i;
  let best = 0, bd = 1e18;
  times.forEach((x,k) => { const d = Math.abs(new Date(x) - new Date(t)); if (d < bd) { bd = d; best = k; } });
  return best;
}
const chunk = (a,n) => { const r=[]; for(let i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; };

// 并发限制 + 失败重试：一次只发少量请求，避免被天气接口限流
async function fetchLimited(tasks, limit) {
  const out = new Array(tasks.length);
  let i = 0;
  async function worker() {
    while (i < tasks.length) {
      const k = i++;
      try { out[k] = await tasks[k](); } catch(e) { out[k] = null; }
    }
  }
  await Promise.all(Array.from({length: Math.min(limit, tasks.length)}, worker));
  return out;
}
async function fetchJsonRetry(url, tries) {
  tries = tries || 2;
  for (let a = 0; a < tries; a++) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      if (j.error) throw new Error(j.reason || "api error");
      return j;
    } catch(e) { if (a === tries-1) throw e; await new Promise(r => setTimeout(r, 900)); }
  }
}

async function loadData() {
  lastLoad = Date.now(); nextRefresh = lastLoad + 30*60*1000;
  document.getElementById("loading").style.display = "flex";
  document.getElementById("errbar").style.display = "none";
  try {
    // 1) 城市天气优先加载
    const cityChunks = chunk(CITIES, 20);
    const cityUrls = cityChunks.map(c => {
      const lat = c.map(x=>x[1]).join(","), lon = c.map(x=>x[2]).join(",");
      return `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,weathercode,cloudcover&timezone=America%2FLos_Angeles&forecast_days=3&temperature_unit=celsius`;
    });
    const cityRes = await fetchLimited(cityUrls.map(u => () => fetchJsonRetry(u)), 3);
    const cities = [];
    cityRes.forEach((arr, ci) => {
      if (!arr) return;
      (Array.isArray(arr)?arr:[arr]).forEach((loc, k) => {
        if (!loc || !loc.hourly) return;
        const c = cityChunks[ci][k];
        cities.push({name:c[0], lat:c[1], lon:c[2], home:!!c[3], h: loc.hourly});
      });
    });
    if (!cities.length) throw new Error("no city data");
    cityData = cities;
    buildSlots();
    render(); // 先画城市，云层随后补上
    const t = new Date().toLocaleString("zh-CN",{timeZone:"America/Los_Angeles",hour:"2-digit",minute:"2-digit"});
    document.getElementById("updated").textContent = "数据更新于 " + t + "（洛杉矶时间）";
    document.getElementById("loading").style.display = "none";
    // 2) 降雨概率网格：限流并发、容忍部分失败，不阻塞城市显示
    const LAT_MIN=43.8, LAT_MAX=50.3, LON_MIN=-124.8, LON_MAX=-116.0, DLAT=0.2, DLON=0.25;
    const grows = Math.floor((LAT_MAX-LAT_MIN)/DLAT)+1, gcols = Math.floor((LON_MAX-LON_MIN)/DLON)+1;
    const pts = [];
    for (let r=0;r<grows;r++) for (let c=0;c<gcols;c++) pts.push([+(LAT_MIN+r*DLAT).toFixed(2), +(LON_MIN+c*DLON).toFixed(2)]);
    cityData._gridMeta = {rows:grows, cols:gcols, LAT_MIN, LAT_MAX, LON_MIN, LON_MAX, DLAT, DLON};
    const gchunks = chunk(pts, 80);
    const gurls = gchunks.map(g => {
      const lat = g.map(x=>x[0]).join(","), lon = g.map(x=>x[1]).join(",");
      return `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=precipitation_probability&timezone=America%2FLos_Angeles&forecast_days=3`;
    });
    const gridRes = await fetchLimited(gurls.map(u => () => fetchJsonRetry(u)), 4);
    // 用经纬度 key 组装网格；缺失点用最近可用点回填，避免整体错位
    const gridMap = new Map();
    gridRes.forEach((arr, gi) => {
      if (!arr) return;
      (Array.isArray(arr)?arr:[arr]).forEach((loc, k) => {
        if (!loc || !loc.hourly) return;
        const p = gchunks[gi][k];
        gridMap.set(p[0].toFixed(2)+","+p[1].toFixed(2), loc.hourly);
      });
    });
    const gm = cityData._gridMeta, grows2 = gm.rows, gcols2 = gm.cols;
    const avail = [];
    gridMap.forEach((h, key) => { const s = key.split(","); avail.push({la:+s[0], lo:+s[1], h}); });
    const gridH = new Array(grows2*gcols2);
    for (let r=0;r<grows2;r++) for (let c=0;c<gcols2;c++) {
      const key = (gm.LAT_MIN+r*gm.DLAT).toFixed(2)+","+(gm.LON_MIN+c*gm.DLON).toFixed(2);
      const h = gridMap.get(key);
      if (h) { gridH[r*gcols2+c] = h; continue; }
      if (!avail.length) { gridH[r*gcols2+c] = null; continue; }
      const la = gm.LAT_MIN+r*gm.DLAT, lo = gm.LON_MIN+c*gm.DLON;
      let best = avail[0], bd = Infinity;
      for (let ai=0; ai<avail.length; ai++) {
        const a = avail[ai], d = (a.la-la)*(a.la-la)+(a.lo-lo)*(a.lo-lo);
        if (d < bd) { bd = d; best = a; }
      }
      gridH[r*gcols2+c] = best.h;
    }
    cityData._gridH = gridH;
    render(); // 补上云层
  } catch(e) {
    console.error(e);
    document.getElementById("errbar").style.display = "block";
    document.getElementById("loading").style.display = "none";
  }
}

// 降雨概率 → 颜色/透明度：分档与城市圆圈一致，概率越高越深
function rainStyle(v) {
  if (v < 5) return null;                                       // 基本不下雨：透明
  if (v < 20) return [170,180,195, Math.round(40+(v-5)/15*40)];     // 概率低：很浅
  if (v < 40) return [140,150,168, Math.round(80+(v-20)/20*40)];    // 20-40%：浅灰
  if (v < 70) return [110,120,140, Math.round(120+(v-40)/30*35)];   // 40-70%：中灰
  return [80,92,112, Math.round(155+(v-70)/30*25)];             // ≥70%：深灰
}
// 有机云纹理：多 octave value noise，让云呈现真实轮廓而非直线/团块
function hash2(x, y) { const h = Math.sin(x*127.1+y*311.7)*43758.5453; return h-Math.floor(h); }
function vnoise(x, y) {
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
let _nz = null;
function noiseField(W, H) {
  if (_nz && _nz.w===W && _nz.h===H) return _nz.f;
  const f = new Float32Array(W*H);
  for (let py=0; py<H; py++) for (let qx=0; qx<W; qx++)
    f[py*W+qx] = vnoise(qx*0.018+13.7, py*0.018+7.3)*0.55
               + vnoise(qx*0.045+3.1,  py*0.045+9.2)*0.30
               + vnoise(qx*0.11+5.5,   py*0.11+1.7)*0.15;
  _nz = {w:W, h:H, f};
  return f;
}
// 连续降雨概率阴影：细网格双线性插值 + 分形噪声雨带纹理 + canvas 半透明图层
function renderRain(slotTime) {
  rainLayer.clearLayers();
  const gridH = cityData._gridH, m = cityData._gridMeta;
  if (!gridH || !gridH.length || !m) return;
  const {rows, cols, LAT_MIN, LAT_MAX, LON_MIN, LON_MAX, DLAT, DLON} = m;
  const vals = new Float32Array(rows*cols);
  for (let k=0;k<gridH.length;k++) {
    const h = gridH[k];
    vals[k] = h ? (h.precipitation_probability[idxOf(h.time, slotTime)] ?? 0) : 0;
  }
  const W = 800, H = 590;
  const nz = noiseField(W, H);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(W, H), px = img.data;
  for (let py=0; py<H; py++) {
    const lat = LAT_MAX - (py+0.5)/H*(LAT_MAX-LAT_MIN);
    let r = (lat-LAT_MIN)/DLAT; r = r<0?0:(r>rows-1.001?rows-1.001:r);
    const r0 = Math.floor(r), fr = r-r0, r1 = Math.min(r0+1, rows-1);
    for (let qx=0; qx<W; qx++) {
      const lon = LON_MIN + (qx+0.5)/W*(LON_MAX-LON_MIN);
      let c = (lon-LON_MIN)/DLON; c = c<0?0:(c>cols-1.001?cols-1.001:c);
      const c0 = Math.floor(c), fc = c-c0, c1 = Math.min(c0+1, cols-1);
      const v = vals[r0*cols+c0]*(1-fr)*(1-fc) + vals[r0*cols+c1]*(1-fr)*fc
              + vals[r1*cols+c0]*fr*(1-fc)     + vals[r1*cols+c1]*fr*fc;
      // 雨带纹理扰动：幅度与概率成正比，无雨区保持干净，雨区呈现有机轮廓
      let ve = v + (nz[py*W+qx]-0.5)*44*(v/100);
      ve = ve<0?0:(ve>100?100:ve);
      const st = rainStyle(ve);
      if (st) {
        const o = (py*W+qx)*4;
        px[o]=st[0]; px[o+1]=st[1]; px[o+2]=st[2]; px[o+3]=st[3];
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  L.imageOverlay(cv.toDataURL(), [[LAT_MIN,LON_MIN],[LAT_MAX,LON_MAX]], {interactive:false}).addTo(rainLayer);
}

function render() {
  const s = slots[activeSlot];
  cityLayer.clearLayers();
  rainLayer.clearLayers();
  const rows = cityData.map(c => {
    const i = idxOf(c.h.time, s.time);
    return {...c, i,
      temp: c.h.temperature_2m[i], prob: c.h.precipitation_probability[i] ?? 0,
      code: c.h.weathercode[i], cc: c.h.cloudcover ? c.h.cloudcover[i] : null};
  });
  rows.forEach(c => {
    const [emoji, desc] = WMO[c.code] || ["❓","未知"];
    const color = probColor(c.prob);
    const icon = L.divIcon({className:"wx"+(c.home?" home":""),
      html:`<div class="badge" style="--c:${color}"><span>${emoji}</span><span class="t">${Math.round(c.temp)}°</span></div><div class="n">${c.home?"★ ":""}${c.name}</div>`,
      iconSize:[70,52], iconAnchor:[35,26]});
    const f = Math.round(c.temp*9/5+32);
    const tip = tipHtml(c.name);
    L.marker([c.lat,c.lon],{icon}).bindPopup(
      `<b>${c.name}</b><br>${emoji} ${desc}<br>🌡 ${Math.round(c.temp)}°C (${f}°F)<br>☔ 降水概率 ${c.prob}%${c.cc!=null?`<br>☁️ 云量 ${c.cc}%`:""}${tip?`<br><br>🎡 好玩推荐<br><span style="font-size:12.5px;line-height:1.7">${tip}</span>`:""}<br><span style="color:#64748b;font-size:12px">${s.label} ${s.sub}</span>`
    ).addTo(cityLayer);
  });
  // 连续降雨概率阴影
  renderRain(s.time);
  // 哪里不下雨：基本不下雨（<5%）和概率低（5–20%）分成两组
  document.getElementById("dryTitle").textContent = `哪里不下雨？（${s.label} ${s.sub}）`;
  const box = document.getElementById("dryList");
  box.innerHTML = "";
  const mkRow = c => {
    const [emoji, desc] = WMO[c.code] || ["❓","未知"];
    const el = document.createElement("div");
    el.className = "dryrow";
    const tip = tipHtml(c.name);
    el.innerHTML = `<div class="r1"><span class="n">${c.home?"★ ":""}${c.name}</span><span class="w">${emoji} ${desc}</span><span class="t">${Math.round(c.temp)}°C</span><span class="p" style="color:${probColor(c.prob)}">${c.prob}%</span></div>${tip?`<div class="tips">${tip}</div>`:""}`;
    el.onclick = () => map.flyTo([c.lat,c.lon], 9, {duration:.8});
    return el;
  };
  const sec = (title, list) => {
    const h = document.createElement("div");
    h.className = "drysec";
    h.textContent = title;
    box.appendChild(h);
    if (!list.length) {
      const e = document.createElement("div");
      e.className = "dryempty";
      e.textContent = "暂无";
      box.appendChild(e);
    } else list.forEach(c => box.appendChild(mkRow(c)));
  };
  sec("☀️ 基本不下雨（<5%）", [...rows].filter(c => c.prob < 5).sort((a,b) => b.temp-a.temp));
  sec("🌤️ 降雨概率低（5–20%）", [...rows].filter(c => c.prob >= 5 && c.prob < 20).sort((a,b) => a.prob-b.prob || b.temp-a.temp));
}

document.getElementById("refreshBtn").onclick = loadData;
document.getElementById("retryBtn").onclick = loadData;
document.getElementById("radarBtn").onclick = toggleRadar;
// 每 30 分钟自动刷新 + 底部倒计时 + 切回页面时若数据超过 10 分钟则刷新（手机切后台会暂停定时器）
let lastLoad = 0, nextRefresh = Date.now() + 30*60*1000;
setInterval(loadData, 30*60*1000);
setInterval(() => {
  const el = document.getElementById("cd");
  if (el) el.textContent = `⏱ ${Math.max(0, Math.ceil((nextRefresh - Date.now())/60000))} 分钟后自动刷新`;
}, 5000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - lastLoad > 10*60*1000) loadData();
});
loadData();
</script>
