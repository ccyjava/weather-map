<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周边天气地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f1f5f9; color: #1e293b; }
  header { background: #0f172a; color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header .meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #cbd5e1; }
  #tabs { display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-bottom: 1px solid #e2e8f0; overflow-x: auto; position: sticky; top: 0; z-index: 500; }
  #tabs button { flex: 1 0 auto; border: 2px solid #e2e8f0; background: #f8fafc; border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  #tabs button .d { display: block; font-size: 11px; color: #64748b; }
  #tabs button.active { border-color: #2563eb; background: #eff6ff; font-weight: 700; }
  #map { height: 62vh; min-height: 380px; }
  #dry { background: #fff; padding: 10px 12px; border-top: 1px solid #e2e8f0; }
  #dryFilter { display: flex; gap: 6px; margin: 0 0 8px; flex-wrap: wrap; }
  #dryFilter .pill { border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 999px; padding: 3px 12px; font-size: 12px; cursor: pointer; color: #475569; }
  #dryFilter .pill.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  #dry .t { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #475569; }
  #dryList { display: flex; flex-direction: column; }
  .dryrow { padding: 8px 4px; border-top: 1px solid #f1f5f9; cursor: pointer; }
  .dryrow:first-child { border-top: none; }
  .dryrow .r1 { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
  .dryrow .n { font-weight: 700; min-width: 92px; }
  .dryrow .w { flex: 1; color: #475569; }
  .dryrow .t { font-weight: 700; }
  .dryrow .p { font-weight: 700; min-width: 44px; text-align: right; }
  .dryrow .d { color: #94a3b8; font-size: 12px; min-width: 52px; text-align: right; }
  .dryrow .tips { font-size: 12px; color: #64748b; margin-top: 5px; line-height: 1.7; }
  .dryempty { color: #64748b; font-size: 13px; padding: 8px 4px; }
  .drysec { font-size: 13px; font-weight: 700; color: #475569; margin: 10px 0 2px; }
  .drysec:first-child { margin-top: 2px; }
  #legend { position: absolute; z-index: 600; left: 10px; bottom: 24px; background: rgba(255,255,255,.94); border-radius: 10px; padding: 8px 12px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #legend .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #legend .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid; }
  #radarBtn.on { background: #dbeafe; border-color: #2563eb; font-weight: 700; }
  footer { padding: 10px 16px 20px; font-size: 11px; color: #94a3b8; }
  /* weather markers */
  .wx { background: none; border: none; }
  .wx .badge { display: flex; align-items: center; gap: 2px; background: rgba(255,255,255,.95); border: 3px solid var(--c); border-radius: 20px; padding: 2px 8px 2px 4px; box-shadow: 0 1px 5px rgba(0,0,0,.25); font-size: 15px; line-height: 1.2; }
  .wx .badge .t { font-weight: 800; font-size: 14px; }
  .wx .n { text-align: center; font-size: 11px; font-weight: 600; color: #0f172a; text-shadow: 0 0 3px #fff, 0 0 3px #fff; margin-top: 1px; white-space: nowrap; }
  .wx.home .badge { background: #fef9c3; }
  .wx.home .n { color: #b45309; }
  #loading { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 1000; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
  #errbar { display: none; background: #fef2f2; color: #b91c1c; padding: 10px 16px; font-size: 13px; }
  #errbar button { margin-left: 10px; }
</style>
</head>
<body>
<header>
  <h1 id="mainTitle">🗺️ 周边天气地图</h1>
  <div class="meta">
    <span id="updated" data-i18n="loadingData">数据加载中…</span>
    <label style="font-size:13px;color:#475569"><span data-i18n="myLocation">📍 我的位置</span> <select id="homeSelect" style="font-size:13px;padding:2px 4px;border-radius:6px;border:1px solid #cbd5e1;max-width:130px"></select>
      <button id="gpsBtn" data-i18n-title="useCurrentLoc" title="使用当前位置" style="font-size:13px;padding:2px 8px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer">🎯</button>
      <input id="locSearch" data-i18n-ph="searchPh" placeholder="搜索位置…" style="font-size:13px;padding:2px 6px;border-radius:6px;border:1px solid #cbd5e1;width:90px">
    </label>
    <button id="langBtn" style="font-size:12px;padding:2px 10px;border-radius:6px;border:1px solid #475569;background:transparent;color:#e2e8f0;cursor:pointer">EN</button>
  </div>
</header>
<div id="errbar"><span data-i18n="loadFailed">⚠️ 天气数据加载失败，请检查网络后</span> <button id="retryBtn" data-i18n="retry">重试</button></div>
<div id="tabs"></div>
<div style="position:relative">
  <div id="map"></div>
  <div id="legend">
    <div class="row"><span class="dot" style="border-color:#16a34a"></span><span data-i18n="legendDry">基本不下雨 &lt;5%</span></div>
    <div class="row"><span class="dot" style="border-color:#a3e635"></span><span data-i18n="legendLow">概率低 5–20%</span></div>
    <div class="row"><span class="dot" style="border-color:#eab308"></span>20–40%</div>
    <div class="row"><span class="dot" style="border-color:#f97316"></span>40–70%</div>
    <div class="row"><span class="dot" style="border-color:#ef4444"></span>≥70%</div>
    <div class="row" style="color:#64748b"><span data-i18n="legendCircle">圆圈颜色 = 降水概率</span></div>
    <div class="row" style="color:#64748b"><span data-i18n="legendShade">灰色阴影 = 降雨概率（越深越可能下雨）</span></div>
    <div class="row"><span style="display:inline-block;width:64px;height:10px;border-radius:5px;background:linear-gradient(to right, rgba(170,180,195,.16), rgba(155,165,182,.31), rgba(125,135,154,.47), rgba(95,106,126,.61), rgba(80,92,112,.71))"></span><span style="color:#64748b" data-i18n="legendLowHigh">概率低 → 概率高</span></div>
    <div class="row"><button id="radarBtn" data-i18n="radar" style="border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer">🛰 雷达回波（实况）</button></div>
  </div>
</div>
<div id="dry">
  <div class="t" id="dryTitle">哪里不下雨？</div>
  <div id="dryFilter"></div>
  <div id="dryList"></div>
</div>
<footer><span data-i18n="dataSrc">数据：Open-Meteo 预报 · 雷达 RainViewer · 底图 © OpenStreetMap ·</span> <span id="cd"></span></footer>
<div id="loading" data-i18n="loadingData">⏳ 正在加载天气数据…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 城市天气 + 好玩推荐全部由服务器 /api/weather 下发（服务器每 30 分钟缓存更新）
const WMO = {0:["☀️","晴"],1:["🌤️","大致晴"],2:["⛅","多云"],3:["☁️","阴"],45:["🌫️","雾"],48:["🌫️","雾凇"],
  51:["🌦️","毛毛雨"],53:["🌦️","毛毛雨"],55:["🌧️","密毛毛雨"],56:["🌧️","冻毛毛雨"],57:["🌧️","冻毛毛雨"],
  61:["🌧️","小雨"],63:["🌧️","中雨"],65:["🌧️","大雨"],66:["🌧️","冻雨"],67:["🌧️","冻雨"],
  71:["❄️","小雪"],73:["❄️","中雪"],75:["❄️","大雪"],77:["❄️","雪粒"],
  80:["🌧️","阵雨"],81:["🌧️","阵雨"],82:["⛈️","强阵雨"],95:["⛈️","雷阵雨"],96:["⛈️","雷暴冰雹"],99:["⛈️","雷暴冰雹"]};
const probColor = p => p < 5 ? "#16a34a" : p < 20 ? "#a3e635" : p < 40 ? "#eab308" : p < 70 ? "#f97316" : "#ef4444";

// 中英文切换：lang 存 localStorage，默认中文
let lang = localStorage.getItem("wx_lang") || "zh";
const I18N = {
zh: {
  appTitle: "🗺️ 周边天气地图",
  loadingData: "⏳ 正在加载天气数据…",
  myLocation: "📍 我的位置",
  useCurrentLoc: "使用当前位置",
  searchPh: "搜索位置…",
  loadFailed: "⚠️ 天气数据加载失败，请检查网络后",
  retry: "重试",
  legendDry: "基本不下雨 <5%",
  legendLow: "概率低 5–20%",
  legendCircle: "圆圈颜色 = 降水概率",
  legendShade: "灰色阴影 = 降雨概率（越深越可能下雨）",
  legendLowHigh: "概率低 → 概率高",
  radar: "🛰 雷达回波（实况）",
  dryTitle: "哪里不下雨？",
  dataSrc: "数据：Open-Meteo 预报 · 雷达 RainViewer · 底图 © OpenStreetMap ·",
  layerCity: "城市天气",
  layerRain: "降雨阴影（预报）",
  clickRain: "降雨概率",
  pillDrive: "🚗 5小时车程",
  pill50: "50km内", pill100: "100km内", pill200: "200km内",
  pillAll: "全部",
  drySecDry: "☀️ 基本不下雨（<5%）",
  drySecLow: "🌤️ 降雨概率低（5–20%）",
  dryEmpty: "暂无",
  rainChance: "☔ 降水概率",
  cloudCover: "☁️ 云量",
  funTips: "🎡 好玩推荐",
  updatedPre: "数据更新于 ",
  updatedSuf: "（洛杉矶时间）",
  countdown: n => `⏱ 数据 ${n} 分钟后更新`,
  geoUnsupported: "当前浏览器不支持定位",
  geoDenied: "请允许浏览器获取位置权限",
  geoFailed: "定位失败：",
  searchNotFound: q => `没找到“${q}”，换个关键词试试`,
  searchFailed: "搜索失败，请检查网络后重试",
  currentLoc: "当前位置",
  unknown: "未知",
},
en: {
  appTitle: "🗺️ Rain Map",
  loadingData: "⏳ Loading weather data…",
  myLocation: "📍 My location",
  useCurrentLoc: "Use current location",
  searchPh: "Search location…",
  loadFailed: "⚠️ Failed to load weather data. Check your network, then",
  retry: "Retry",
  legendDry: "Barely rains <5%",
  legendLow: "Low chance 5–20%",
  legendCircle: "Circle color = rain probability",
  legendShade: "Gray shade = rain probability (darker = more likely)",
  legendLowHigh: "Low → high",
  radar: "🛰 Radar (live)",
  dryTitle: "Where isn't it raining?",
  dataSrc: "Data: Open-Meteo forecast · RainViewer radar · Map © OpenStreetMap ·",
  layerCity: "City weather",
  layerRain: "Rain shade (forecast)",
  clickRain: "rain chance",
  pillDrive: "🚗 5-hr drive",
  pill50: "≤50km", pill100: "≤100km", pill200: "≤200km",
  pillAll: "All",
  drySecDry: "☀️ Barely rains (<5%)",
  drySecLow: "🌤️ Low rain chance (5–20%)",
  dryEmpty: "None",
  rainChance: "☔ Rain chance",
  cloudCover: "☁️ Cloud cover",
  funTips: "🎡 Fun ideas",
  updatedPre: "Updated ",
  updatedSuf: " (Los Angeles time)",
  countdown: n => `⏱ Data refreshes in ${n} min`,
  geoUnsupported: "Geolocation is not supported by this browser",
  geoDenied: "Please allow location access",
  geoFailed: "Location failed: ",
  searchNotFound: q => `No results for "${q}". Try another keyword.`,
  searchFailed: "Search failed. Check your network and retry.",
  currentLoc: "Current location",
  unknown: "Unknown",
}};
function t(k) {
  const d = I18N[lang] || I18N.zh;
  return d[k] != null ? d[k] : (I18N.zh[k] != null ? I18N.zh[k] : k);
}
const WMO_EN = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Rime fog",
  51:"Drizzle",53:"Drizzle",55:"Dense drizzle",56:"Freezing drizzle",57:"Freezing drizzle",
  61:"Light rain",63:"Moderate rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",
  71:"Light snow",73:"Moderate snow",75:"Heavy snow",77:"Snow grains",
  80:"Showers",81:"Showers",82:"Heavy showers",95:"Thunderstorm",96:"Thunderstorm w/ hail",99:"Thunderstorm w/ hail"};
function wmoDesc(code) {
  const w = WMO[code] || ["❓","未知"];
  return [w[0], lang === "en" ? (WMO_EN[code] || t("unknown")) : w[1]];
}
function tipOf(c) { return lang === "en" ? (c.tip_en || c.tip || "") : (c.tip || ""); }
// 时段文字由 s.time 现场生成（中英各自表述），不依赖服务端 label
function slotText(s) {
  const day = s.time.slice(0, 10), hh = parseInt(s.time.slice(11, 13), 10);
  const ampm = hh < 12;
  const todayStr = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  const diff = Math.round((Date.parse(day) - Date.parse(todayStr)) / 864e5);
  const dt = new Date(day + "T12:00:00");
  const md = (dt.getMonth()+1) + "/" + dt.getDate();
  if (lang === "zh") {
    const dp = ["今天","明天","后天","大后天"][diff];
    const wk = "周" + "日一二三四五六"[dt.getDay()];
    return {label: (dp || md + " " + wk) + (ampm ? "上午" : "下午"), sub: md + " " + wk};
  }
  const dp = ["Today","Tomorrow"][diff];
  const wk = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()];
  return {label: (dp || wk) + " " + (ampm ? "AM" : "PM"), sub: md + " " + wk};
}
function applyStaticLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t("appTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  const lb = document.getElementById("langBtn");
  if (lb) lb.textContent = lang === "zh" ? "EN" : "中文";
}
function setLang(l) {
  lang = l;
  localStorage.setItem("wx_lang", l);
  applyStaticLang();
  buildLayerControl();
  buildSlots();
  render();
  renderUpdated();
}

const map = L.map("map").setView([47.61, -122.20], 6); // 默认Bellevue 5小时范围
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 18, attribution:"© OpenStreetMap"}).addTo(map);
const cityLayer = L.layerGroup().addTo(map);
const rainLayer = L.layerGroup().addTo(map);
let radarLayer = null, radarOn = false;
let layerCtl = null;
function buildLayerControl() {
  if (layerCtl) map.removeControl(layerCtl);
  layerCtl = L.control.layers(null, {[t("layerCity")]: cityLayer, [t("layerRain")]: rainLayer}, {collapsed: false}).addTo(map);
}
buildLayerControl();
// 点地图任意位置查降雨概率
let clickMk = null;
map.on("click", e => {
  const p = probAt(e.latlng.lat, e.latlng.lng, activeSlot);
  if (p == null) return;
  const pv = Math.round(p);
  if (clickMk) map.removeLayer(clickMk);
  clickMk = L.circleMarker(e.latlng, {radius: 7, color: probColor(pv), weight: 3, fillOpacity: 0}).addTo(map);
  L.popup({closeButton: false}).setLatLng(e.latlng)
    .setContent(`<div style="font-size:14px">☔ <b style="color:${probColor(pv)}">${pv}%</b> <span style="color:#64748b;font-size:12px">${t("clickRain")}</span></div>`)
    .openOn(map);
});
async function toggleRadar() {
  radarOn = !radarOn;
  document.getElementById("radarBtn").classList.toggle("on", radarOn);
  if (radarOn && !radarLayer) {
    try {
      const j = await (await fetch("https://api.rainviewer.com/public/weather-maps.json")).json();
      const past = j.radar && j.radar.past;
      if (past && past.length) {
        const p = past[past.length-1].path;
        radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${p}/256/{z}/{x}/{y}/2/1_1.png`, {opacity:.65});
      }
    } catch(err) { console.warn("radar failed", err); }
  }
  if (radarLayer) { radarOn ? radarLayer.addTo(map) : map.removeLayer(radarLayer); }
  else if (radarOn) { radarOn = false; document.getElementById("radarBtn").classList.remove("on"); }
}

let slots = [], activeSlot = 0, cityData = [];
let dryMaxDist = 500; // 距离筛选：默认5小时车程（约500km）
let gridP = null, gridMeta = null; // 服务端降雨概率网格 flat 数组 rows*cols*时段数
function buildSlots() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  slots.forEach((s,i) => {
    const b = document.createElement("button");
    const st = slotText(s);
    b.innerHTML = `${st.label}<span class="d">${st.sub}</span>`;
    if (i === activeSlot) b.classList.add("active");
    b.onclick = () => { activeSlot = i; buildSlots(); render(); };
    tabs.appendChild(b);
  });
}
async function loadData() {
  lastLoad = Date.now();
  document.getElementById("loading").style.display = "flex";
  document.getElementById("errbar").style.display = "none";
  try {
    // 所有数据走自家服务器：/api/weather 只读服务端缓存；
    // 刷新由服务端后台每 30 分钟统一执行，客户端只读不触发抓取
    const r = await fetch("/api/weather");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (j.error || !j.cities || !j.cities.length) throw new Error(j.error || "no data");
    slots = j.slots;
    if (activeSlot >= slots.length) activeSlot = 0;
    if (!cityData.length && slots.length) {
      // 首次加载：默认选中最近一个还没过去的时段
      try {
        const parts = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hour12:false}).formatToParts(new Date());
        const o = {}; parts.forEach(x => o[x.type] = x.value);
        const nowH = `${o.year}-${o.month}-${o.day}T${o.hour}`;
        const fi = slots.findIndex(s => s.time.slice(0,13) >= nowH);
        if (fi >= 0) activeSlot = fi;
      } catch(e) {}
    }
    cityData = j.cities;
    gridMeta = j.grid.meta;
    if (typeof j.grid.p === "string") {
      // base64 字节串（服务端 grid.meta.enc=b64）：解码为 Uint8Array
      const bin = atob(j.grid.p);
      gridP = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) gridP[i] = bin.charCodeAt(i);
    } else {
      gridP = j.grid.p;
    }
    const hsel = document.getElementById("homeSelect");
    if (hsel && !hsel.options.length) {
      cityData.forEach(c => {
        const o = document.createElement("option");
        o.value = c.name; o.textContent = (c.home ? "★ " : "") + c.name;
        hsel.appendChild(o);
      });
      hsel.value = getHomeName();
      const h0 = getHomeCoords();
      if (h0.name !== "Bellevue") map.setView([h0.lat, h0.lon], 6);
      hsel.onchange = () => {
        if (hsel.value === "__custom") return;
        setHomeName(hsel.value); render();
        const hc = cityData.find(c => c.name === hsel.value);
        if (hc) map.setView([hc.lat, hc.lon], 6);
      };
    }
    // 🎯 获取当前位置
    const gpsBtn = document.getElementById("gpsBtn");
    if (gpsBtn && !gpsBtn.dataset.bound) {
      gpsBtn.dataset.bound = "1";
      gpsBtn.onclick = () => {
        if (!navigator.geolocation) { alert(t("geoUnsupported")); return; }
        gpsBtn.textContent = "⏳"; gpsBtn.disabled = true;
        navigator.geolocation.getCurrentPosition(
          pos => {
            gpsBtn.textContent = "🎯"; gpsBtn.disabled = false;
            setHomeCustom(t("currentLoc"), pos.coords.latitude, pos.coords.longitude, true);
            map.setView([pos.coords.latitude, pos.coords.longitude], 6);
            render();
          },
          err => {
            gpsBtn.textContent = "🎯"; gpsBtn.disabled = false;
            alert(t("geoFailed") + (err.code === 1 ? t("geoDenied") : err.message));
          },
          {enableHighAccuracy:true, timeout:15000}
        );
      };
    }
    // 🔍 搜索位置：先匹配190城，否则用 Nominatim 地理编码
    const locSearch = document.getElementById("locSearch");
    if (locSearch && !locSearch.dataset.bound) {
      locSearch.dataset.bound = "1";
      const doSearch = async () => {
        const q = locSearch.value.trim();
        if (!q) return;
        const hit = cityData.find(c => c.name.toLowerCase() === q.toLowerCase());
        if (hit) {
          setHomeName(hit.name);
          map.setView([hit.lat, hit.lon], 6);
          render(); locSearch.value = "";
          return;
        }
        locSearch.disabled = true;
        try {
          const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=" + lang + "&q=" + encodeURIComponent(q));
          const arr = await r.json();
          if (arr && arr.length) {
            const nm = (arr[0].display_name || q).split(",")[0].trim();
            const la = parseFloat(arr[0].lat), lo = parseFloat(arr[0].lon);
            setHomeCustom(nm, la, lo);
            map.setView([la, lo], 6);
            render();
          } else {
            alert(t("searchNotFound")(q));
          }
        } catch(e) { alert(t("searchFailed")); }
        locSearch.disabled = false; locSearch.value = "";
      };
      locSearch.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
    }
    buildSlots();
    render();
    lastUpdatedAt = j.updated_at;
    renderUpdated();
    // 下次真正抓取时间 = 服务端数据时间 + 30分钟；用户点刷新/进页面只读缓存，不触发抓取
    nextRefresh = j.updated_at*1000 + 30*60*1000;
    document.getElementById("loading").style.display = "none";
  } catch(e) {
    console.error(e);
    document.getElementById("errbar").style.display = "block";
    document.getElementById("loading").style.display = "none";
  }
}

// 降雨概率 → 阴影颜色/透明度：连续映射，概率每差 1% 深浅都不同（13% 和 6% 肉眼可辨）
const RAIN_STOPS = [
  [5,  [148,162,184,100]],
  [20, [135,150,172,140]],
  [40, [105,120,144,175]],
  [70, [80,93,116,205]],
  [100,[65,78,102,225]],
];
function rainStyle(v) {
  if (v < 5) return null;
  let a = RAIN_STOPS[0], b = RAIN_STOPS[RAIN_STOPS.length-1];
  for (let i = 0; i < RAIN_STOPS.length-1; i++) {
    if (v <= RAIN_STOPS[i+1][0]) { a = RAIN_STOPS[i]; b = RAIN_STOPS[i+1]; break; }
  }
  const t = (v - a[0]) / (b[0] - a[0]);
  return [0,1,2,3].map(k => Math.round(a[1][k] + (b[1][k]-a[1][k])*t));
}
// 有机云纹理：多 octave value noise，让云呈现真实轮廓而非直线/团块
function hash2(x, y) { const h = Math.sin(x*127.1+y*311.7)*43758.5453; return h-Math.floor(h); }
function vnoise(x, y) {
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
let _nz = null;
function noiseField(W, H) {
  if (_nz && _nz.w===W && _nz.h===H) return _nz.f;
  const f = new Float32Array(W*H);
  for (let py=0; py<H; py++) for (let qx=0; qx<W; qx++)
    f[py*W+qx] = vnoise(qx*0.016+13.7, py*0.016+7.3)*0.7
               + vnoise(qx*0.04+3.1,  py*0.04+9.2)*0.3;
  _nz = {w:W, h:H, f};
  return f;
}
// 网格平滑：3x3 均值滤波一遍，抹掉单点尖峰、雨带连成片，同时保留细粒度变化
function smoothGrid(slotIdx) {
  const {rows, cols} = gridMeta;
  let vals = new Float32Array(rows*cols);
  for (let k=0;k<rows*cols;k++) vals[k] = gridP[k*slots.length+slotIdx] ?? 0;
  const nv = new Float32Array(rows*cols);
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
    let s=0, n=0;
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) {
      const rr=r+dr, cc=c+dc;
      if (rr>=0 && rr<rows && cc>=0 && cc<cols) { s += vals[rr*cols+cc]; n++; }
    }
    nv[r*cols+c] = s/n;
  }
  return nv;
}
// 查任意经纬度的插值降雨概率（与阴影同一数据源）
function probAt(lat, lon, slotIdx) {
  if (!gridP || !gridMeta) return null;
  const {rows, cols, LAT_MIN, LAT_MAX, LON_MIN, LON_MAX, DLAT, DLON} = gridMeta;
  if (lat < LAT_MIN || lat > LAT_MAX || lon < LON_MIN || lon > LON_MAX) return null;
  const vals = smoothGrid(slotIdx);
  let r = (lat-LAT_MIN)/DLAT; r = Math.max(0, Math.min(rows-1.001, r));
  let c = (lon-LON_MIN)/DLON; c = Math.max(0, Math.min(cols-1.001, c));
  const r0 = Math.floor(r), fr = r-r0, r1 = Math.min(r0+1, rows-1);
  const c0 = Math.floor(c), fc = c-c0, c1 = Math.min(c0+1, cols-1);
  return vals[r0*cols+c0]*(1-fr)*(1-fc) + vals[r0*cols+c1]*(1-fr)*fc
       + vals[r1*cols+c0]*fr*(1-fc)     + vals[r1*cols+c1]*fr*fc;
}
// 连续降雨概率阴影：细网格双线性插值 + 分形噪声雨带纹理 + canvas 半透明图层
function renderRain(slotIdx) {
  rainLayer.clearLayers();
  if (!gridP || !gridMeta) return;
  const FADE_PX = 55; // 边缘羽化：距网格边界 55px 内透明度渐隐，消除矩形硬边
  const {rows, cols, LAT_MIN, LAT_MAX, LON_MIN, LON_MAX, DLAT, DLON} = gridMeta;
  const vals = smoothGrid(slotIdx);
  const W = 800, H = 590;
  const nz = noiseField(W, H);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(W, H), px = img.data;
  for (let py=0; py<H; py++) {
    const lat = LAT_MAX - (py+0.5)/H*(LAT_MAX-LAT_MIN);
    let r = (lat-LAT_MIN)/DLAT; r = r<0?0:(r>rows-1.001?rows-1.001:r);
    const r0 = Math.floor(r), fr = r-r0, r1 = Math.min(r0+1, rows-1);
    for (let qx=0; qx<W; qx++) {
      const lon = LON_MIN + (qx+0.5)/W*(LON_MAX-LON_MIN);
      let c = (lon-LON_MIN)/DLON; c = c<0?0:(c>cols-1.001?cols-1.001:c);
      const c0 = Math.floor(c), fc = c-c0, c1 = Math.min(c0+1, cols-1);
      const v = vals[r0*cols+c0]*(1-fr)*(1-fc) + vals[r0*cols+c1]*(1-fr)*fc
              + vals[r1*cols+c0]*fr*(1-fc)     + vals[r1*cols+c1]*fr*fc;
      // 雨带纹理扰动：幅度与概率成正比，无雨区保持干净，雨区呈现有机轮廓
      let ve = v + (nz[py*W+qx]-0.5)*14*(v/100);
      ve = ve<0?0:(ve>100?100:ve);
      const st = rainStyle(ve);
      if (st) {
        const o = (py*W+qx)*4;
        let fd = Math.min(qx, W-1-qx, py, H-1-py) / FADE_PX;
        if (fd > 1) fd = 1;
        fd = fd*fd*(3-2*fd);
        px[o]=st[0]; px[o+1]=st[1]; px[o+2]=st[2]; px[o+3]=st[3]*fd;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  L.imageOverlay(cv.toDataURL(), [[LAT_MIN,LON_MIN],[LAT_MAX,LON_MAX]], {interactive:false}).addTo(rainLayer);
}

// 我的位置：默认 Bellevue，可切换/GPS/搜索；存在 localStorage；只影响距离/★/排序，不重新抓数据
// 存储格式：{type:"city",name} 或 {type:"custom",name,lat,lon}；兼容旧版纯字符串
function getHome() {
  const raw = localStorage.getItem("wx_home");
  if (!raw) return {type:"city", name:"Bellevue"};
  try { const o = JSON.parse(raw); if (o && o.type) return o; } catch(e) {}
  return {type:"city", name:raw};
}
function setHome(h) { localStorage.setItem("wx_home", JSON.stringify(h)); }
function getHomeName() { return getHome().name; }
function setHomeName(n) { setHome({type:"city", name:n}); }
function setHomeCustom(name, lat, lon, isGps) { setHome({type:"custom", name, lat, lon, gps: !!isGps}); }
function homeDisplayName() {
  const h = getHome();
  if (h.type === "custom" && h.gps) return t("currentLoc");
  return h.name;
}
function getHomeCoords() {
  const h = getHome();
  if (h.type === "custom") return h;
  const c = cityData.find(x => x.name === h.name);
  return c ? {name:c.name, lat:c.lat, lon:c.lon} : {name:"Bellevue", lat:47.61, lon:-122.20};
}
function syncHomeSelect() {
  const sel = document.getElementById("homeSelect");
  if (!sel) return;
  const h = getHome();
  let opt = sel.querySelector('option[value="__custom"]');
  if (h.type === "custom") {
    if (!opt) { opt = document.createElement("option"); opt.value = "__custom"; sel.insertBefore(opt, sel.firstChild); }
    opt.textContent = "📍 " + homeDisplayName();
    sel.value = "__custom";
  } else {
    if (opt) opt.remove();
    if (sel.value !== h.name) sel.value = h.name;
  }
}
function refreshHomeUI() {
  document.getElementById("mainTitle").textContent = t("appTitle");
  document.title = t("appTitle");
  syncHomeSelect();
}
function render() {
  const s = slots[activeSlot];
  refreshHomeUI();
  cityLayer.clearLayers();
  rainLayer.clearLayers();
  const _home = getHomeCoords();
  if (_home.type === "custom") {
    L.marker([_home.lat, _home.lon], {
      icon: L.divIcon({className:"", html:'<div style="font-size:22px;filter:drop-shadow(0 1px 2px #fff)">📍</div>', iconSize:[22,22], iconAnchor:[11,20]})
    }).addTo(cityLayer).bindTooltip("📍 " + homeDisplayName());
  }
  const rows = cityData.map(c => {
    const v = c.slots[activeSlot] || {};
    return {...c,
      temp: v.t, prob: v.prob ?? 0,
      code: v.code, cc: v.cc};
  });
  // 到家的距离（km）：列表按离家距离排序（家=用户选的位置）
  const home = getHomeCoords();
  const R = 6371, rad = Math.PI/180;
  rows.forEach(c => {
    const dLa = (c.lat-home.lat)*rad, dLo = (c.lon-home.lon)*rad;
    const h = Math.sin(dLa/2)**2 + Math.cos(home.lat*rad)*Math.cos(c.lat*rad)*Math.sin(dLo/2)**2;
    c.dist = 2*R*Math.asin(Math.sqrt(h));
  });
  rows.forEach(c => {
    const [emoji, desc] = wmoDesc(c.code);
    const color = probColor(c.prob);
    const isHome = home.type !== "custom" && c.name === home.name;
    const icon = L.divIcon({className:"wx"+(isHome?" home":""),
      html:`<div class="badge" style="--c:${color}"><span>${emoji}</span><span class="t">${Math.round(c.temp)}°</span></div><div class="n">${isHome?"★ ":""}${c.name}</div>`,
      iconSize:[70,52], iconAnchor:[35,26]});
    const f = Math.round(c.temp*9/5+32);
    const tip = tipOf(c);
    const st0 = slotText(s);
    L.marker([c.lat,c.lon],{icon}).bindPopup(
      `<b>${c.name}</b><br>${emoji} ${desc}<br>🌡 ${Math.round(c.temp)}°C (${f}°F)<br>${t("rainChance")} ${c.prob}%${c.cc!=null?`<br>${t("cloudCover")} ${c.cc}%`:""}${tip?`<br><br>${t("funTips")}<br><span style="font-size:12.5px;line-height:1.7">${tip}</span>`:""}<br><span style="color:#64748b;font-size:12px">${st0.label} ${st0.sub}</span>`
    ).addTo(cityLayer);
  });
  // 连续降雨概率阴影
  renderRain(activeSlot);
  // 哪里不下雨：基本不下雨（<5%）和概率低（5–20%）分成两组
  const st1 = slotText(s);
  document.getElementById("dryTitle").textContent = lang === "zh"
    ? `${t("dryTitle")}（${st1.label} ${st1.sub}）`
    : `${t("dryTitle")} (${st1.label}, ${st1.sub})`;
  const box = document.getElementById("dryList");
  box.innerHTML = "";
  const mkRow = c => {
    const [emoji, desc] = wmoDesc(c.code);
    const el = document.createElement("div");
    el.className = "dryrow";
    const tip = tipOf(c);
    el.innerHTML = `<div class="r1"><span class="n">${c.name===home.name?"★ ":""}${c.name}</span><span class="w">${emoji} ${desc}</span><span class="t">${Math.round(c.temp)}°C</span><span class="p" style="color:${probColor(c.prob)}">${c.prob}%</span><span class="d">📍${Math.round(c.dist)}km</span></div>${tip?`<div class="tips">${tip}</div>`:""}`;
    el.onclick = () => map.flyTo([c.lat,c.lon], 9, {duration:.8});
    return el;
  };
  const sec = (title, list) => {
    const h = document.createElement("div");
    h.className = "drysec";
    h.textContent = title;
    box.appendChild(h);
    if (!list.length) {
      const e = document.createElement("div");
      e.className = "dryempty";
      e.textContent = t("dryEmpty");
      box.appendChild(e);
    } else list.forEach(c => box.appendChild(mkRow(c)));
  };
  // 距离筛选 pills（默认全部）
  const df = document.getElementById("dryFilter");
  if (df && !df.children.length) {
    [[t("pillDrive"), 500], [t("pill50"), 50], [t("pill100"), 100], [t("pill200"), 200], [t("pillAll"), Infinity]].forEach(([label, v]) => {
      const b = document.createElement("button");
      b.className = "pill" + (v === dryMaxDist ? " on" : "");
      b.textContent = label;
      b.onclick = () => { dryMaxDist = v; render(); };
      df.appendChild(b);
    });
  } else if (df) {
    [...df.children].forEach((b, i) => b.classList.toggle("on",
      [500, 50, 100, 200, Infinity][i] === dryMaxDist));
  }
  const inDist = rows.filter(c => c.dist <= dryMaxDist);
  // 先按降水概率分档（5%一档），同档内按离家距离由近到远
  const byGradeDist = (a,b) => (Math.floor(a.prob/5)-Math.floor(b.prob/5)) || (a.dist-b.dist);
  sec(t("drySecDry"), inDist.filter(c => c.prob < 5).sort(byGradeDist));
  sec(t("drySecLow"), inDist.filter(c => c.prob >= 5 && c.prob < 20).sort(byGradeDist));
}

document.getElementById("retryBtn").onclick = loadData;
document.getElementById("radarBtn").onclick = toggleRadar;
document.getElementById("langBtn").onclick = () => setLang(lang === "zh" ? "en" : "zh");
applyStaticLang();
// 每 5 分钟重读一次服务端缓存（只读，不触发抓取）+ 底部倒计时 + 切回页面时重读
let lastLoad = 0, nextRefresh = Date.now() + 30*60*1000, lastUpdatedAt = 0;
function renderUpdated() {
  if (!lastUpdatedAt) return;
  const ts = new Date(lastUpdatedAt*1000).toLocaleString(lang === "zh" ? "zh-CN" : "en-US",{timeZone:"America/Los_Angeles",hour:"2-digit",minute:"2-digit"});
  document.getElementById("updated").textContent = t("updatedPre") + ts + t("updatedSuf");
}
setInterval(loadData, 5*60*1000);
setInterval(() => {
  const el = document.getElementById("cd");
  if (el) el.textContent = t("countdown")(Math.max(0, Math.ceil((nextRefresh - Date.now())/60000)));
}, 5000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - lastLoad > 10*60*1000) loadData();
});
loadData();
</script>
